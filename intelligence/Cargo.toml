[package]
name = "intelligence"
version = "0.1.0"
edition = "2024"

[lib]
name = "intelligence"

[features]
default = ["ollama"]
ollama = ["dep:ollama-rs"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
ollama-rs = { version = "0.3.6", optional = true, features = ["stream"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tokio-stream = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
