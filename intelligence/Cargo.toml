[package]
name = "intelligence"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-core = { git = "https://github.com/huggingface/candle.git", version = "0.11.1" }
ollama-rs = "0.3.6"
reqwest = { version = "0.13.5", features = ["json"] }
sanitizer = { version = "1.0.0", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "rt-multi-thread"] }
tokio-stream = "0.1.19"
validator = { version = "0.21.0", features = ["derive"] }
