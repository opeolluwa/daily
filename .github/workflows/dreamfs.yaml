name: dreamfs

on:
  push:
    branches: [master]
    paths:
      - "dreamfs/**"
      - ".github/workflows/dreamfs.yaml"
  pull_request:
    branches: [master]
    paths:
      - "dreamfs/**"
      - ".github/workflows/dreamfs.yaml"

permissions:
  contents: read

jobs:
  bazel:
    name: bazel
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: setup bazel
        uses: bazelbuild/setup-bazelisk@v3

      - name: cache bazel downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel/_bazel_*/cache/repos
          key: ${{ runner.os }}-bazel-${{ hashFiles('dreamfs/MODULE.bazel*') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: build and test
        working-directory: dreamfs
        run: bazel test //...
