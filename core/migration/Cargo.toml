[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "migration"

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-std = { version = "1", features = ["attributes", "tokio1"] }
hex = "0.4.3"
kernel_macros = { version = "0.1.0", path = "../macros" }
sea-orm = { version = "2.0.0-rc.37", features = [
    "macros",
    "debug-print",
    "with-uuid",
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "with-chrono",
    "seaography",
] }
serde_json = "1.0"
ulid = { workspace = true, features = ["serde"] }
uuid = { version = "1.21.0", features = ["v4", "js"] }

[dependencies.sea-orm-migration]
version = "~2.0.0-rc.37"
features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
