[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[features]
pdf = ["dep:ironpress"]
cipher = ["hex", "aes-gcm", "base64"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
migration = { version = "0.1.0", path = "migration" }
reqwest = { version = "0.13.2", features = ["json"] }
sea-orm = { version = "2.0.0-rc.37", features = [
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dependencies]
aes-gcm = { version = "0.11.1", optional = true }
argon2 = "0.5"
async-graphql = { version = "7.0.17", features = ["apollo_tracing", "raw_value", "tracing", "uuid"] }
async-trait = "0.1.89"
base64 = { version = "0.23.1", optional = true }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3.32"
graphql_client = "0.16.0"
hex = {version ="0.4.3", optional = true}
ironpress = { version = "1.7.0", optional = true }
log = "0.4.29"
kernel_macros = { version = "0.1.0", path = "macros" }
rand_core = { version = "0.6", features = ["getrandom"] }
sanitizer = { version = "1.0.0", features = ["derive"] }
sea-orm = { version = "2.0.0-rc.37", features = [
    "macros",
    "mock",
    "debug-print",
    "with-uuid",
    "with-chrono",
    "seaography",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt"] }
ts-rs = { version = "12.0.1", features = ["uuid-impl", "chrono-impl", "serde-json-impl", "format"] }
uuid = { version = "1.21.0", features = ["v4", "js"] }
validator = { version = "0.20.0", features = ["derive"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4"

[dependencies.seaography]
version = "~2.0.0-rc.8"
features = [
    "graphql-playground",
    "with-decimal",
    "with-chrono",
    "with-uuid",
    "with-postgres-array",
]

[dev-dependencies]
lazy_static = "1.5.0"
